# =====================================================================
# train_decima_true_thermal.yaml — Decima (Mao 2019) thermal variant
# =====================================================================
# Variant 2 of 2 (thermal). Decima true with the SAME reward signal as
# Ours / decima_fair.  Isolates a single dimension of the §5 ablation
# chain: REINFORCE + Homogeneous GCN vs PPO + HeteroGNN under
# controlled reward conditions.  Pair with train_decima_true_vanilla.yaml
# for the full controlled-comparison cube.
#
# Ablation cube (paper §5):
#   | Variant         | Reward    | Algo       | GNN          |
#   |-----------------|-----------|------------|--------------|
#   | Decima vanilla  | makespan  | REINFORCE  | Homog GCN    |
#   | Decima thermal  | thermal   | REINFORCE  | Homog GCN    |  <- THIS
#   | decima_fair     | thermal   | PPO        | Hetero GAT   |
#   | Ours            | thermal   | PPO        | Hetero+RC    |
#
# Chain reads: vanilla -> thermal isolates reward; thermal -> fair
# isolates algo+GNN; fair -> Ours isolates RC edge attribute.
# =====================================================================
# Status (HK-3.1.2): UNBLOCKED.
#
# Code support (decima_true.py Step 1-6, env reward_mode dispatch,
# observation_keys filter) shipped in HK-3.0 / HK-3.1 / HK-3.1.1.
# Vanilla pilot result that motivates running this variant:
#   - 5380 episodes (~1.3 M env-steps) at ep_return baseline ≈ 20
#     -> no learning under makespan_only reward in this env
#   - vanilla ckpt retained as the paper §5 ablation data point
#     ("homog GCN + REINFORCE + Mao reward, plateaued")
#
# This thermal variant trains the same DecimaTruePolicy on identical
# hyper-params but with reward_mode=thermal_aware.  The question it
# answers: is REINFORCE + homog GCN capable of learning at all in
# this env when the reward signal carries thermal information, or
# is the algorithm itself the bottleneck?
# =====================================================================
_inherit: default

training:
  algorithm:        reinforce            # NEW: dispatch in train.py
  device:           cuda                 # HK-3.1.1: explicit V100 target
  baseline_type:    moving_average       # Mao 2019 §5.1
  baseline_window:  50                   # episodes
  learning_rate:    5.0e-4               # Mao 2019 had 1e-3; tune in pilot
  total_steps:      5_000_000            # match Ours stage 1 budget; REINFORCE is slow
  # NOTE: warm_start NOT applicable — REINFORCE optimizer / loss are
  # incompatible with the PPO checkpoints under checkpoints/stage1*.

model:
  architecture:     decima_true          # NEW: registry lookup
  gnn_type:         gcn_homogeneous      # torch_geometric.nn.GCNConv stack
  hidden_dim:       256
  num_gcn_layers:   4

env:
  # Observation stripping — Decima never sees thermal info, even when
  # the reward signal is thermal-aware. The model is blind to RC state;
  # only the reward delivers thermal information.
  observation_keys: [task_x, edges_t2t]

# Reward — thermal-aware (SAME as Ours). This is what makes this the
# 'thermal' variant.  Lives under the top-level `reward:` section (not
# under `env:`) — see vanilla yaml for the env_factory rationale.
reward:
  reward_mode:      thermal_aware

logging:
  run_name:         decima_true_thermal_N17
  checkpoint_dir:   "checkpoints/decima_true_thermal_N17"
  tb_log_dir:       "tb_logs/decima_true_thermal_N17"

# =====================================================================
# Runtime guard removed (HK-3.1.2): decima_true Step 1-6 implemented,
# device dispatch fixed, vanilla pilot confirmed reward-channel choice
# is the right next thing to probe.
# =====================================================================
