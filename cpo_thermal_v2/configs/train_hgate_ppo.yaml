# =====================================================================
# train_hgate_ppo.yaml — HGATE-PPO (Wu 2025 IEEE IoT Journal) baseline
# =====================================================================
# Status (HK-4.6): retrain config after HK-4.5 V100 pilot ckpt_ep_012400
# (~909k steps) eval showed peak_T ~ HEFT (no thermal-awareness signal).
#
# Wu 2025 Table IV (paper page 13, authoritative) — HK-4.6.1:
#   The user provided Wu 2025 Table IV directly (we'd previously been
#   blocked by IEEE Xplore HTTP 418 + a code-empty official GitHub).
#   HK-4.6.1 pins three hyper-params to the Table IV authoritative
#   values and keeps the other nine consistent with Wu 2025 + Ours
#   defaults for the unspecified entries:
#
#     Wu 2025 Table IV authoritative:
#       learning_rate    = 2e-4              (Fig 4 sweet spot)
#       entropy_coef     = 0.01              (Wu's c2)
#       gae_lambda       = 0.98
#       heads            = 4
#       num_gat_layers   = 2
#       value_coef       = 0.5               (Wu's c1)
#       clip_eps         = 0.2
#       gamma            = 0.99
#       ppo_epochs       = 4                 (Wu's K)
#
#     Wu 2025 unspecified — Ours stage 1 fallback (per task spec):
#       minibatch_size   = 64
#       rollout_length   = 256
#       num_envs         = 16
#
# HK-4.6 rationale (preserved): the rolling-50-episode best.pt gate in
# train_hgate_ppo.py replaces the broken max-of-rollout gate that locked
# best.pt at a single cold-stage lucky episode during the HK-4.5 V100
# pilot (best.pt was pinned at step 397k forever).
#
# HK-4.6 best.pt fix:
#   - train_hgate_ppo.py now uses a rolling-50-episode mean gate for
#     best.pt instead of `max(per-rollout-episodes)`.  The old gate
#     locked best.pt at the first lucky cold-stage episode (step 397k,
#     ep_ret_mean=+859) and never updated.
#
# §5 ablation chain isolation point:
#   Ours-auto_only  --(strip RC edge + cross-attention)-->  HGATE-PPO
# =====================================================================
_inherit: default

training:
  algorithm:        ppo
  device:           cuda             # HK-3.1.1: explicit V100 anchor
  total_steps:      5_000_000        # match Ours stage 1 budget
  num_envs:         16               # Ours stage 1 async batch
  rollout_length:   256
  learning_rate:    2.0e-4           # Wu 2025 Table IV (Fig 4 sweet spot)
  clip_eps:         0.2              # Wu 2025 Table IV
  value_coef:       0.5              # Wu 2025 Table IV (c1)
  entropy_coef:     0.01             # Wu 2025 Table IV (c2)
  gae_lambda:       0.98             # Wu 2025 Table IV
  gamma:            0.99             # Wu 2025 Table IV
  ppo_epochs:       4
  minibatch_size:   64

model:
  architecture:     hgate_ppo        # NEW: dispatch in checklist Step 5
  hidden_dim:       128
  num_gat_layers:   2
  num_heads:        4
  # NOTE: explicitly NOT passing rc_edge_dim / cross_attention_dim —
  # this baseline has neither (controlled comparison vs Ours).

env:
  action_mode:      auto_only
  # No observation_keys filter.  HGATE sees the full graph_obs schema
  # EXCEPT that the encoder consumes only task_x / proc_x / edges_t2t
  # / edges_t2p / edges_t2p_attr[:, 0]  (NOT edges_p2p* — the RC
  # coupling — and NOT edges_t2p_attr[:, 1] — est_temp_rise).  The
  # encoder enforces this in code, not via env-side stripping.

logging:
  run_name:         hgate_ppo_N17
  checkpoint_dir:   "checkpoints/hgate_ppo_N17"
  tb_log_dir:       "tb_logs/hgate_ppo_N17"

