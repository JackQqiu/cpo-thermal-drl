# =====================================================================
# Companion to eval_stage2_validation.yaml.
# This run uses Stage 1's best.pt under auto_only mode for the cleanest
# comparison ("the policy as it was at end of Stage 1").
# Same seed_base for paired comparison across runs.
# =====================================================================
_inherit: default
eval:
  checkpoint_path: "checkpoints/stage1_auto_only_N17/best.pt"
  num_episodes:    50
  deterministic:   true
  seed_base:       100000
  device:          cpu
  num_nodes_list:   [17]
  action_mode_list: [auto_only]
  scheduler_filter: ["Ours-auto_only"]
  T_target:           75.0
  initial_temp_range: [50.0, 65.0]
  max_dag_size:       null
  dags_per_episode:   20
  output_dir: "eval_results/stage2_validation_stage1ckpt_auto"
